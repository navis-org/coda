<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <!-- Coda's own neuroglancer: a frame, not a page — see `vite/entries.ts`. -->
    <meta name="robots" content="noindex" />
    <title>Neuroglancer</title>
    <style>
      html,
      body {
        margin: 0;
        height: 100%;
        overflow: hidden;
        background: #000;
      }
      /*
       * Neuroglancer's own Find Path, on a graphene layer's Graph tab — hidden only where Coda's
       * find path takes F on this card (the frame sets the attribute: `FrameKeysMessage.findPath`),
       * so two find-path tools never draw two routes; elsewhere it is the reader's (`docs/find-path-plan.md`).
       */
      html[data-coda-find-path]
        .neuroglancer-graphene-tab
        .neuroglancer-tool-button:has(> .neuroglancer-tool-button-label[title^='Find Path']) {
        display: none;
      }
    </style>
  </head>
  <body>
    <script type="module" src="./src/ngframe/main.ts"></script>
  </body>
</html>
