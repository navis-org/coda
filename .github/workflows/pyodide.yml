# The Python half of Coda's numerical backend, actually executed.
#
# Split out from `deploy.yml` for exactly the reason `export.yml` is: this needs something the
# rest of the suite does not have. vitest has no Pyodide and jsdom has no `Worker`, so nothing
# in `pnpm test` runs a line of `src/pyodide/*.py` — and the TypeScript marshalling and the
# Python signatures are a pair that nothing type-checks. That is the same drift the emitter
# registry has, and the answer is the same: a job that runs the real thing when the real thing
# changes.
#
# It installs Pyodide from npm, which the app itself deliberately does not depend on (the
# browser loads it from a CDN). The version is read from `src/pyodide/sources.json`, so this
# checks the runtime the app actually pins rather than whatever npm calls latest — a bump is
# then a deliberate change with its own diff, instead of an unrelated PR going red.
name: Python runtime

on:
  push:
    paths:
      - 'src/pyodide/**'
      - 'scripts/probe-nblast.mjs'
      - 'scripts/probe-linkage.mjs'
      - 'scripts/probe-transform.mjs'
      - 'scripts/probe-skeletons.mjs'
      - 'scripts/probe-meshes.mjs'
      - 'scripts/probe-matches.mjs'
      # The landmark files and their manifest: the transform probe reads the real ones, so a
      # regenerated set is a change to what this job checks even when no Python moved.
      - 'public/transforms/**'
      - 'src/data/transforms/manifest.json'
      - '.github/workflows/pyodide.yml'
  pull_request:
    paths:
      - 'src/pyodide/**'
      - 'scripts/probe-nblast.mjs'
      - 'scripts/probe-linkage.mjs'
      - 'scripts/probe-transform.mjs'
      - 'scripts/probe-skeletons.mjs'
      - 'scripts/probe-meshes.mjs'
      - 'scripts/probe-matches.mjs'
      - 'public/transforms/**'
      - 'src/data/transforms/manifest.json'
  workflow_dispatch:

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 26

      # The version the app pins, not `latest`. `pyodideIndex` is the single copy of it —
      # `sources.json` exists so this file and `runtime.ts` cannot disagree about which
      # runtime is under test.
      - name: Install the pinned Pyodide
        run: |
          version=$(node -p "require('./src/pyodide/sources.json').pyodideIndex.match(/\/v([0-9.]+)\//)[1]")
          echo "Pyodide $version"
          npm install --no-save "pyodide@$version"

      # Runs `src/pyodide/nblast.py` through the same entry point the worker calls, with the
      # same request shape, and asserts the contract rather than the scores: a square result,
      # a flat float64 array, one finite score per pair, a self-match of exactly 1, and
      # progress actually reported. fastcore owns the numbers; this owns the marshalling.
      - run: node scripts/probe-nblast.mjs
        env:
          PYODIDE_PATH: node_modules/pyodide

      # The clustering capability, in its own process for the reason it has its own `.py`: what
      # a probe checks is one function's contract. The second boot costs a few seconds against
      # a job that only runs when `src/pyodide/**` changes.
      - run: node scripts/probe-linkage.mjs
        env:
          PYODIDE_PATH: node_modules/pyodide

      # The landmark transforms, against the **real** landmark files rather than a fixture —
      # which is what lets one assertion cover the whole read path: a thin-plate spline
      # reproduces its own landmarks exactly, so a column read in the wrong order or a unit
      # conversion applied twice lands kilometres out rather than fractions of a nanometre.
      # It also exercises `from_coefs`, which is the path every session after the first takes.
      - run: node scripts/probe-transform.mjs
        env:
          PYODIDE_PATH: node_modules/pyodide

      # The skeleton pipeline. What it checks above everything else is `_reindex`: parent ids
      # that were not re-based onto row numbers still *draw*, as a neuron whose branches have
      # been shuffled, so every case asserts that every parent is -1 or an index into its own
      # neuron. The empty neuron in its fixture is there because the item count is an
      # invariant — the attribute table is index-aligned with it.
      - run: node scripts/probe-skeletons.mjs
        env:
          PYODIDE_PATH: node_modules/pyodide

      # The mesh pipeline, whose equivalent silent failure is a face index that is no longer
      # local to its own mesh — a cloud of stray triangles between two neurons rather than an
      # error. Its fixture is one closed icosphere and one with a face cut out, which is the
      # pair that tells "fill holes did something" from "fill holes capped a closed mesh".
      - run: node scripts/probe-meshes.mjs
        env:
          PYODIDE_PATH: node_modules/pyodide

      # Match extraction, and the one probe that checks *numbers* rather than marshalling —
      # because parity is the entire reason that node crosses the bridge. `percentage` is a
      # band around each group's own best, `skip_self` is the diagonal, and both are asserted
      # against a brute-force count written from the definition.
      - run: node scripts/probe-matches.mjs
        env:
          PYODIDE_PATH: node_modules/pyodide
