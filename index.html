<!doctype html>
<html lang="en" data-theme="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Coda — Connectome Data Analysis in the Browser</title>
    <!--
      Also the `og:description`, the `twitter:description` and the JSON-LD `description` — see
      vite/seo.ts, which reads them off this tag rather than keeping a second copy. None of the
      notes in this file ship — vite/stripComments.ts sweeps them out of everything the build
      publishes — which is the only reason one this long is affordable here.

      Length is the constraint nobody sees: Google shows about 155 characters and cuts the tail,
      so this is written to fit rather than trimmed to fit, and the first 120 carry the weight
      because that is where a phone truncates.

      What it says is deliberately what the title tag does not, in two registers, because two
      different readers arrive at this string. A search engine wants the backends by name — they
      are the query somebody actually types. The categorisation engines that decide whether a
      domain is a research tool or a parked page lean on this field almost alone, and for them
      the load-bearing words are `scientific`, `web application` and above all `public`: the
      data Coda reads is published connectome data, and a sentence that does not say so leaves
      a reviewer to guess. Hence one sentence carrying both, in that order.
    -->
    <!--
      One line, and `prettier-ignore` is what keeps it one line: Prettier wraps a `<meta>` past
      its print width onto four, at which point `grep 'meta name="description"'` finds nothing on
      a page that has always had one. That is how this file was read as lacking a description.
      vite/stripComments.ts warns if the pin is ever lost; docs/seo.md has the rest.
    -->
    <!-- prettier-ignore -->
    <meta name="description" content="A scientific web application for browser-based analysis and visualisation of public connectome data: neuPrint, CAVE (FlyWire, MICrONS) and CATMAID." />

    <!--
      The mark is the musical coda sign — see docs/logo.md. Two files, because they fail
      differently: logo.svg is the outline cut, which keeps its identity at 16px and so is the
      favicon; icon.svg is the solid cut on a plate, which has more presence but reads as a
      four-pointed star that small, so it is only ever used at touch-icon size.
    -->
    <link rel="icon" href="/logo.svg" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />

    <!--
      Installable, so Coda can be launched in its own window with no tabs and no address bar
      at all — the persistent counterpart to the toolbar's ⛶, which is one session's worth.
      `start_url` and `scope` inside the manifest are *relative*, which is what makes it work
      under the `/coda/` subpath GitHub Pages serves from; an absolute `/` would scope the
      installed app to the domain root, where nothing of ours lives.

      Vite rewrites these absolute public paths against `base` ('./'), so the same is true of
      the href here. There is deliberately no service worker: this app has no offline story —
      every dataset it reads comes over the network — and a cache that outlived a deploy is
      the classic way to strand somebody on a stale bundle.
    -->
    <link rel="manifest" href="/manifest.webmanifest" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="Coda" />
    <meta name="theme-color" media="(prefers-color-scheme: light)" content="#f9f9f7" />
    <meta name="theme-color" media="(prefers-color-scheme: dark)" content="#171716" />
  </head>
  <body>
    <!--
      The editor is the URL everybody links, and until this block it was a `div` and a script —
      no heading, no sentence, nothing saying what the thing is. Google renders JavaScript and
      would have found the start page eventually; nothing else does. Not Bing's fast path, not a
      single link unfurler, and not one of the crawlers that feed language models — which for a
      research tool is now a first-class way of being found, since "which browser tool reads
      neuPrint" gets asked of an assistant as often as of a search box.

      So: `noscript` rather than markup inside `#root`. `createRoot().render()` clears the
      container's children, so a static hero in there would be a flash of unstyled content on
      every load, paid by every real visitor, to serve a crawler. This costs nobody anything and
      is also the honest version of the claim — it *is* what this page offers with no script.

      Inline styles rather than classes: the app's stylesheet is a `<link>` in a production
      build but is injected by JavaScript in dev, so a class-based version would look correct in
      one and be unstyled in the other. Self-contained is the only form that is right in both.
      Values are theme.css's dark block, matching the `data-theme` pinned on <html> above.

      The three links are the pages that carry the actual prose. Keep them relative: `base` is
      './' so the whole site works from a subpath, and an absolute '/overview.html' would 404
      everywhere but the domain root.
    -->
    <noscript>
      <div
        style="
          max-width: 46rem;
          margin: 0 auto;
          padding: 4rem 1.5rem;
          font-family: system-ui, -apple-system, 'Segoe UI', sans-serif;
          color: #c3c2b7;
          line-height: 1.6;
        "
      >
        <h1 style="color: #fff; font-size: 2.25rem; line-height: 1.15; margin: 0 0 0.75rem">
          Coda — connectome data analysis in the browser
        </h1>
        <p style="font-size: 1.15rem; margin: 0 0 1.5rem">
          A node-graph editor for querying and analysing connectomic data. Wire up the steps —
          query, traverse, filter, aggregate, plot — and each one shows its result where it sits.
          No install and no notebook.
        </p>
        <p>
          Coda reads <strong>neuPrint</strong> (hemibrain, MANC, optic-lobe, male-CNS),
          <strong>CAVE</strong> (FlyWire, MICrONS), <strong>CATMAID</strong>, precomputed
          Neuroglancer sources and your own CSV or Parquet files. Results export as CSV, SWC,
          images and Neuroglancer links, or as a Python or R script that runs the same pipeline
          locally.
        </p>
        <p><strong>Coda needs JavaScript and WebGL.</strong> These pages do not:</p>
        <ul>
          <li><a href="./overview.html" style="color: #3987e5">Feature overview</a> — what Coda is, in one scroll.</li>
          <li><a href="./tutorial.html" style="color: #3987e5">Field guide</a> — a ten-minute introduction that builds a real pipeline.</li>
          <li><a href="./nodes.html" style="color: #3987e5">Node guide</a> — every node, what it takes and what it hands on.</li>
          <li><a href="https://github.com/navis-org/coda" style="color: #3987e5">Source on GitHub</a> — MIT licensed.</li>
        </ul>
      </div>
    </noscript>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
