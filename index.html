<!doctype html>
<html lang="en" data-theme="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Coda — Connectome Data Analysis</title>
    <meta
      name="description"
      content="Node-graph analysis pipelines for connectomic data."
    />

    <!--
      The mark is the musical coda sign — see docs/logo.md. Two files, because they fail
      differently: logo.svg is the outline cut, which keeps its identity at 16px and so is the
      favicon; icon.svg is the solid cut on a plate, which has more presence but reads as a
      four-pointed star that small, so it is only ever used at touch-icon size.
    -->
    <link rel="icon" href="/logo.svg" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />

    <!--
      Installable, so Coda can be launched in its own window with no tabs and no address bar
      at all — the persistent counterpart to the toolbar's ⛶, which is one session's worth.
      `start_url` and `scope` inside the manifest are *relative*, which is what makes it work
      under the `/coda/` subpath GitHub Pages serves from; an absolute `/` would scope the
      installed app to the domain root, where nothing of ours lives.

      Vite rewrites these absolute public paths against `base` ('./'), so the same is true of
      the href here. There is deliberately no service worker: this app has no offline story —
      every dataset it reads comes over the network — and a cache that outlived a deploy is
      the classic way to strand somebody on a stale bundle.
    -->
    <link rel="manifest" href="/manifest.webmanifest" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="Coda" />
    <meta name="theme-color" media="(prefers-color-scheme: light)" content="#f9f9f7" />
    <meta name="theme-color" media="(prefers-color-scheme: dark)" content="#171716" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
